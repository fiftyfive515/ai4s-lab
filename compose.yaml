services:
  lab:
    build: .
    container_name: ai4s-lab
    restart: unless-stopped
    ports:
      - "8089:8089"
    volumes:
      - lab-data:/data
    environment:
      ATLAS_PUBLIC_ORIGIN: ${ATLAS_PUBLIC_ORIGIN:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8089/')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  lab-data:
